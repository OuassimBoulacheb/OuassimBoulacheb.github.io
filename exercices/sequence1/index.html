<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toy Story</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <img class="logo" src="images/toy-story-logo.png" alt="Toy Story">
    <div id="card-container">
        <div class="toy-card">
            <div class="toy-card__image">
                <img src="images/woody.png" alt="Woody">
            </div>
            <div class="toy-card__name">Woody</div>
            <div class="toy-card__body">
            <div class="toy-card__description">
                Les mains en l'air ! Le shérif Woody est là pour faire régner l'ordre dans la chambre d'Andy.
            </div>
            <div class="toy-card__unit-stats">
                <div class="one-third">
                    <div class="stat">25</div>
                    <div class="stat-value">Vie</div>
                </div>
                <div class="one-third">
                    <div class="stat">16</div>
                    <div class="stat-value">Discrétion</div>
                </div>
                <div class="one-third">
                    <div class="stat">80</div>
                    <div class="stat-value">Action</div>
                </div>
            </div>
            </div>
        </div>
    </div>
</body>

</html>
