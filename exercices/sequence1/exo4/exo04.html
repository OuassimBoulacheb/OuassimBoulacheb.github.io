<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Toy Story</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <img class="logo" src="../images/toy-story-logo.png" alt="Toy Story">
    <div id="mazone"></div>

    <script type="text/javascript">

        fetch('datastory.json')
            .then(function (reponse) {
                return reponse.json();
            })
            .then(function (reponse2) {

                let html = '';

                reponse2.forEach(function (element) {

                    html +=
                        '<div class="toy-card">' +
                            '<div class="toy-card__image">' +
                                '<img src="../' + element.photo + '" alt="' + element.nom + '">' +
                            '</div>' +
                            '<div class="toy-card__name">' + element.nom + '</div>' +
                            '<div class="toy-card__body">' +
                                '<div class="toy-card__description">' + element.info + '</div>' +
                                '<div class="toy-card__unit-stats">' +
                                    '<div class="one-third"><div class="stat">' + element.vie + '</div><div class="stat-value">Vie</div></div>' +
                                    '<div class="one-third"><div class="stat">' + element.discretion + '</div><div class="stat-value">Discrétion</div></div>' +
                                    '<div class="one-third"><div class="stat">' + element.action + '</div><div class="stat-value">Action</div></div>' +
                                '</div>' +
                            '</div>' +
                        '</div>';

                });

                document.getElementById('mazone').innerHTML = html;

            });

    </script>
</body>

</html>
